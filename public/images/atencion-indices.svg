<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Índices atencionales: ejercicio con tiempos ficticios</title><desc id="desc">Tres pares de tiempos para calcular alerta, orientación y conflicto. Valores en milisegundos.</desc>
<rect width="900" height="540" rx="24" fill="#f7f3ea"/>
<g font-family="Arial, sans-serif" fill="#25342b"><text x="40" y="55" font-size="29" font-weight="bold">Tres contrastes, tres preguntas</text><text x="40" y="88" font-size="19">Datos ficticios · Tiempos de reacción (ms)</text>
<rect x="35" y="115" width="830" height="105" rx="16" fill="#e5eff3"/><text x="55" y="151" font-size="24" font-weight="bold">Alerta · Solo ensayos neutros</text><text x="55" y="193" font-size="25">Sin tono: 500 ms</text><text x="475" y="193" font-size="25">Con tono: 470 ms</text>
<rect x="35" y="235" width="830" height="105" rx="16" fill="#e3eee1"/><text x="55" y="271" font-size="24" font-weight="bold">Orientación</text><text x="55" y="313" font-size="25">Inválida: 540 ms</text><text x="475" y="313" font-size="25">Válida: 505 ms</text>
<rect x="35" y="355" width="830" height="105" rx="16" fill="#fff0d7"/><text x="55" y="391" font-size="24" font-weight="bold">Control · Costo del conflicto</text><text x="55" y="433" font-size="25">Incongruente: 560 ms</text><text x="475" y="433" font-size="25">Congruente: 515 ms</text>
<text x="40" y="503" font-size="19">Calculá cada diferencia e interpretá su alcance.</text></g></svg>
